<!doctype html>
<html lang="zh-Hans-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="./css/index.css" />
    <script src="./js/lib/vue-3.5.44.js"></script>
    <script src="./js/lib/jquery-3.6.0.js"></script>
    <script src="./js/util.js"></script>
  </head>
  <body style="display: none">
    <div id="index" class="index">
      <div class="line">
        <div class="label">股票代號:</div>
        <input type="text" class="input" v-model="code" />
        <div class="label">購買價格:</div>
        <input type="text" class="input" v-model="buyPrice" />
        <input type="button" class="button" value="新增" @click="click('add')" />
        <input type="button" class="button" value="刪除" @click="click('delete')" />
      </div>
      <table class="table">
        <tr class="row">
          <td class="column">代碼</td>
          <td class="column">購買價格</td>
          <td class="column">目前價格</td>
          <td class="column">最後更新時間</td>
          <td class="column">狀態</td>
        </tr>
        <tr class="row" v-for="array in list">
          <td class="column" v-for="text in array" v-html="text"></td>
        </tr>
      </table>
    </div>
    <script>
      const { reactive, toRefs, computed, watch } = Vue;
      const index = {
        setup() {
          const state = reactive({
            ws: null,
            code: "",
            buyPrice: 0,
            list: [],
          });
          const click = (type) => {
            switch (type) {
              case "add":
              case "delete": {
                const { code, buyPrice } = state;
                if (code.length != 0) {
                  if (type == "add") {
                    send("addCode", { code, buyPrice });
                  } else {
                    send("deleteCode", { code });
                  }
                }
                break;
              }
            }
          };
          const send = (cmd, param) => {
            param.cmd = cmd;
            state.ws.send(JSON.stringify(param));
          };
          const receive = (message) => {
            const { cmd, array: list } = JSON.parse(message);
            switch (cmd) {
              case "updateProduct": {
                state.list = [];
                list.forEach((item) => {
                  const array = [];
                  array.push(item.code);
                  array.push(item.buyPrice);
                  array.push(item.price);
                  array.push(util.formatDate(new Date(item.time)));
                  array.push(item.status);
                  state.list.push(array);
                });
                break;
              }
            }
          };
          const init = () => {
            state.ws = new WebSocket(`ws://localhost:8888`);
            state.ws.onmessage = (message) => {
              receive(message.data);
            };
          };
          init();
          return {
            ...toRefs(state),
            click,
          };
        },
      };
      Vue.createApp(index).mount("#index");
    </script>
  </body>
</html>
